site_name: CI/CD Mastery Path
site_description: "A free CI/CD course on GitHub Actions and Jenkins covering pipelines, testing gates, caching, secrets, deployment strategies, GitOps, supply-chain security and operating pipelines at scale."
site_url: https://sigilipelli.github.io/cicd-mastery-path/
repo_url: https://github.com/sigilipelli/cicd-mastery-path
repo_name: cicd-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Pipeline Foundations":
      - Overview: level-1/index.md
      - "01 · What CI/CD Is and Why Pipelines Exist": level-1/01-what-ci-cd-is.md
      - "02 · Pipeline Anatomy: Triggers, Jobs, Steps & Stages": level-1/02-pipeline-anatomy.md
      - "03 · GitHub Actions Essentials": level-1/03-github-actions-essentials.md
      - "04 · Jenkins Essentials and the Jenkinsfile": level-1/04-jenkins-essentials.md
      - "05 · Testing Gates and Fast Feedback": level-1/05-testing-gates.md
      - "06 · Reproducible Builds and Caching": level-1/06-reproducible-builds-caching.md
      - "07 · Artifacts, Registries and Versioning": level-1/07-artifacts-versioning.md
      - "08 · Secrets in Pipelines": level-1/08-secrets-in-pipelines.md
      - "09 · Branching Strategies and Pull Request Checks": level-1/09-branching-pr-checks.md
