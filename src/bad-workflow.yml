name: release
on:
  pull_request_target:
    types: [opened]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Greet
        run: echo "Building ${{ github.event.pull_request.title }}"
      - name: Deploy to production
        run: ./deploy.sh
